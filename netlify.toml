[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

# Caching for media assets (images, videos, fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL Rewrites & Redirects
[[redirects]]
  from = "/films"
  to = "/films.html"
  status = 200

[[redirects]]
  from = "/photography"
  to = "/photography.html"
  status = 200

[[redirects]]
  from = "/stills"
  to = "/photography.html"
  status = 301

[[redirects]]
  from = "/verticals"
  to = "/verticals.html"
  status = 200

[[redirects]]
  from = "/reels"
  to = "/verticals.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
